[package]
name = "revc"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "reMiami launcher: Rust owns main() and links the C++ game as a static library"
build = "build.rs"

[[bin]]
name = "remiami"	# (the project's name; the package stays "revc")
path = "src/main.rs"

[dependencies]
# Raw SDL3 bindings, linked against the system libSDL3 (pacman sdl3).
sdl3-sys = "0.7"
# PNG screenshots for the regression harness (testdrive.rs).
png = "0.18"
revc-audio = { path = "../revc-audio" }
# the second audio back end (audio/retro.rs); public crate, pinned; no device output of its own (SDL is ours)
retro-audio = { git = "https://github.com/MissingTheDao/retro-audio", rev = "cdcc59980a4e4360123ec868f7e71a8feb58153e", default-features = false }
revc-timing = { path = "../revc-timing" }
revc-formats = { path = "../revc-formats" }
revc-import = { path = "../revc-import" }
# The renderer: revc-rw on wgpu (Vulkan, OpenGL; DX12 on Windows), plan task 12.
revc-rw = { path = "../revc-rw" }
# Deflate for texture packs in zip files (texmods.rs); already in the tree via png.
miniz_oxide = "0.8"
# CRC-32 for the PS2 texture pack built at import (ps2pack.rs); already in the tree via png.
crc32fast = "1.5"

[features]
# Kept so `--features wgpu` in old commands still builds; the wgpu renderer is the only one.
wgpu = []
