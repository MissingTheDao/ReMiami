[package]
name = "revc"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "reVC launcher: Rust owns main() and links the C++ game as a static library"
build = "build.rs"

[[bin]]
name = "revc"
path = "src/main.rs"

[dependencies]
# Raw SDL3 bindings, linked against the system libSDL3 (pacman sdl3).
sdl3-sys = "0.7"
# PNG screenshots for the regression harness (testdrive.rs).
png = "0.18"
revc-audio = { path = "../revc-audio" }
revc-timing = { path = "../revc-timing" }
revc-formats = { path = "../revc-formats" }
revc-import = { path = "../revc-import" }
# The renderer: revc-rw on wgpu (Vulkan, OpenGL; DX12 on Windows), plan task 12.
revc-rw = { path = "../revc-rw" }
# Deflate for texture packs in zip files (texmods.rs); already in the tree via png.
miniz_oxide = "0.8"

[features]
# Kept so `--features wgpu` in old commands still builds; the wgpu renderer is the only one.
wgpu = []
