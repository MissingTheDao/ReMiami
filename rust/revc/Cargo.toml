[package]
name = "revc"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "reVC launcher: Rust owns main() and links the C++ game as a static library"
build = "build.rs"

[[bin]]
name = "revc"
path = "src/main.rs"

[dependencies]
# Raw SDL3 bindings, linked against the system libSDL3 (pacman sdl3).
sdl3-sys = "0.7"
