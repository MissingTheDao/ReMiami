[package]
name = "revc-rw"
description = "Rust replacement for librw (plan task 12): RenderWare-style rendering on wgpu with a selectable Vulkan or OpenGL backend"
edition.workspace = true
version.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
wgpu = "30.0.1"
pollster = "1.0.1"
revc-formats = { path = "../revc-formats" }
# The engine-neutral renderer core, published separately; pinned to a reviewed rev (both ports
# use the same one). For local work on it, see docs/RETRO_WGPU.md ("Working on retro-wgpu").
retro-wgpu = { git = "https://github.com/MissingTheDao/retro-wgpu", rev = "d2831a4d05b2acac3de0f0ca85de7bab6fc4c0ec" }

[dev-dependencies]
png = "0.18"
naga = { version = "30.0.1", features = ["wgsl-in"] }
# The window_clear example opens an SDL3 window like the game host does.
sdl3-sys = "0.7"
