[workspace]
resolver = "3"
members = ["revc", "revc-audio", "revc-timing"]
# `cargo run` / `cargo build` mean the game; tools are built with -p (e.g. -p revc-audio --bin audiocmp).
default-members = ["revc"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
rust-version = "1.99"

[profile.dev]
# The C++ side is built RelWithDebInfo regardless; keep Rust debuggable.
opt-level = 1
