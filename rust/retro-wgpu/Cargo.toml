[package]
name = "retro-wgpu"
description = "Engine-neutral renderer core on wgpu for ports and remasters of fixed-function era games (Vulkan, OpenGL, Direct3D 12)"
edition = "2024"
version = "0.2.0"
publish = false
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[dependencies]
wgpu = "30.0.1"
pollster = "1.0.1"
# Texture packs and dumps (PNG).
png = "0.18"
# Stage 3: RetroArch slang presets on the final image (feature "slang"). MPL-2.0 OR GPL-3.0-only;
# used under MPL-2.0 (see NOTICE.md).
librashader-runtime-wgpu = { version = "0.12.1", optional = true }
librashader-presets = { version = "0.12", optional = true }
librashader-common = { version = "0.12", optional = true }
librashader-runtime = { version = "0.12", optional = true }

[features]
default = []
slang = ["dep:librashader-runtime-wgpu", "dep:librashader-presets", "dep:librashader-common", "dep:librashader-runtime"]

